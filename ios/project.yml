# The Xcode project is generated from this (XcodeGen), so nothing generated is kept in the repository.
# Build: brew install xcodegen && xcodegen generate && open apiM.xcodeproj
name: apiM
options:
  bundleIdPrefix: com.rottenvia
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
    # Signed ad hoc for the simulator; the .ipa is built unsigned and signed by whatever installs it (Sideloadly, AltStore).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  apiM:
    type: application
    platform: iOS
    sources:
      - path: apiM
    info:
      path: apiM/Info.plist
      properties:
        CFBundleDisplayName: apiM
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        NSLocalNetworkUsageDescription: apiM connects to the apiM app on your computer over your network.
        NSCameraUsageDescription: apiM uses the camera to scan the pairing code on your computer, and for photos you send.
        NSPhotoLibraryAddUsageDescription: apiM saves pictures from your chats to Photos when you ask it to.
        CFBundleURLTypes:
          - CFBundleURLName: com.rottenvia.apim.pair
            CFBundleURLSchemes:
              - apim
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rottenvia.apim
        # iPhone only: XcodeGen's own default for an app (iPhone and iPad) wins over the project-wide setting.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  apiMTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: apiMTests
    dependencies:
      - target: apiM
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rottenvia.apim.tests
  apiMUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: apiMUITests
    dependencies:
      - target: apiM
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rottenvia.apim.uitests
        TEST_TARGET_NAME: apiM
schemes:
  apiM:
    build:
      targets:
        apiM: all
        apiMTests: [test]
        apiMUITests: [test]
    test:
      config: Debug
      targets:
        - apiMTests
        - apiMUITests
