[package]
name = "apim"
version = "0.1.0"
edition = "2024"
description = "apiM desktop: the native Rust version, no browser engine"
license = "MIT"

[dependencies]
flate2 = "1"
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "accesskit", "links", "wayland", "x11"] }
egui_extras = { version = "0.36", features = ["image", "file", "svg"] }
pulldown-cmark = { version = "0.13", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "stream", "http2", "gzip", "system-proxy"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "fs"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
walkdir = "2"
globset = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rfd = "0.17"
sha2 = "0.10"
base64 = "0.22"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
