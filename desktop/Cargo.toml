[package]
name = "apim"
version = "0.1.0"
edition = "2024"
description = "apiM desktop: the native Rust version, no browser engine"
license = "MIT"

[dependencies]
# Where a sign-in goes on to once it is done (`browser::live::sign_in`). Already built for reqwest.
url = "2.5.8"
# Colour emoji: the same crates egui already builds, used directly.
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
harfrust = "0.12.0"
tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "simd"] }
flate2 = "1"
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "accesskit", "links", "wayland", "x11"] }
egui_extras = { version = "0.36", features = ["image", "file", "svg"] }
pulldown-cmark = { version = "0.13", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
# Already in the tree through egui: read here for pictures and files on the clipboard, which egui does not hand over.
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "stream", "http2", "gzip", "system-proxy"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "fs", "net"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
regex = "1"
walkdir = "2"
globset = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rfd = "0.17"
sha2 = "0.10"
base64 = "0.22"
# Already built for rustls: signs the GitHub App's sign-in (RS256).
ring = "0.17"
pdf-extract = "0.12.1"
# The phone pairing code (Settings > Phone). No dependencies of its own.
qrcodegen = "1.8"

[target.'cfg(windows)'.dependencies]
# A real browser view in the Browser pane (`ui::webview`): WebView2, part of Windows 11. The handle crate is already in the tree.
wry = "0.57"
raw-window-handle = "0.6"
# The guardian service (`src/bin/guardian.rs`): the SCM lifecycle (install, control handler, restart-on-kill recovery),
# and the raw Win32 to launch apiM into the logged-in user's session from session 0 and wait on its process.
windows-service = "0.7"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_RemoteDesktop",
    "Win32_System_Environment",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security",
] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
