; Production-ish defaults for the report service.
[server]
host = 0.0.0.0
port = 8080
workers = auto
debug = no

[database]
url = postgres://reports:s3cret@db.internal:5432/reports
pool_size = 12
timeout = 4.5

[features]
enabled = export, Search, scheduling, export
beta_users = Ana@example.com, bo@example.com

[logging]
level = warn
file = /var/log/reports/app.log
